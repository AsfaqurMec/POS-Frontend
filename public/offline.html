<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Terminal - Offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #18110B;
      color: #F7F3EE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #231812;
      border: 1px solid #382418;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: #2D1D15;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #5A3822;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #FBBF24;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.9rem;
      color: #CBB9AB;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #D97706;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #B45309; }
    .status {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #8C7A6B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Network Connection Lost</h1>
    <p>The POS terminal is currently offline. Please check your local network or Wi-Fi router to resume live transactions.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="status">POS Terminal • Standalone Mode</div>
  </div>
</body>
</html>
